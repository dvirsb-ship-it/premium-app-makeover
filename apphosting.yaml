# Firebase App Hosting — קונפיגורציית הפריסה של JustAsk.
# הבנייה: vite build עם NITRO_PRESET=node-server → שרת Node ב-.output/server.
# מפתח Gemini מגיע מ-Cloud Secret Manager — לעולם לא בקוד.

runConfig:
  # מכונה אחת תמיד חמה (7/8/2026). קודם 0 — ואז הבקשה הראשונה אחרי
  # שקט המתינה 2-4 שניות לאתחול. זו בדיוק הבקשה של מי שהגיע מקמפיין
  # ורואה את המוצר בפעם הראשונה, ואין הזדמנות שנייה לרושם הזה.
  # ~40₪ לחודש.
  minInstances: 1
  # תקרת גלישה פתאומית: 10×80 = ~800 בקשות בו-זמנית. משלמים רק על מה
  # שרץ בפועל — התקרה היא ביטוח חינם. לא גבוה מזה בכוונה: התקרה היא גם
  # תקרת הנזק הכספי אם בוט יתקוף.
  maxInstances: 10
  concurrency: 80
  cpu: 1
  # 1GB ולא 512MB: ולידציה מחזיקה עד שלוש תמונות כ-base64 בזיכרון בבת
  # אחת — ובמקור המלא, לא במוקטן — ובמקביל אותה מכונה מטפלת בעוד
  # בקשות לפי concurrency. 512MB היה מספיק לבדיקות, לא לעומס.
  memoryMiB: 1024

env:
  - variable: NITRO_PRESET
    value: node-server
    availability:
      - BUILD

  # קונפיגורציית Firebase ציבורית (client config) — נדרשת בזמן הבנייה כי .env לא בגיט.
  # אלה ערכים ציבוריים-בתכנון: הם ממילא מוטמעים ב-bundle שנשלח לכל דפדפן.
  - variable: VITE_FIREBASE_API_KEY
    value: AIzaSyD1ipfVOVOJypr8jU04aSg1frV21Cptp-8
    availability:
      - BUILD
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    # ⚠️ חייב להישאר הדומיין שלנו — לא firebaseapp.com.
    #
    # עם firebaseapp.com, המצב הזמני של ההפניה נשמר על דומיין זר, וספארי
    # חוסם אותו כאחסון צד-שלישי. getRedirectResult חוזר ריק, המשתמש חוזר
    # מגוגל עדיין מנותק, לוחץ שוב — ולולאת התחברות. זה קרה בבדיקה אמיתית
    # ב-31/07/2026.
    #
    # התלות: כתובת ההחזרה חייבת להיות רשומה ב-OAuth client
    # (40146464592-980gh7hmr9l3sdua3ddilciv05j5s5p7) —
    # https://<הדומיין>/__/auth/handler. אם משנים דומיין, לרשום שם קודם
    # ולחכות להפצה, אחרת גוגל תחזיר redirect_uri_mismatch לכולם.
    #
    # מוגש ע"י proxyFirebaseAuth ב-src/server.ts.
    value: justask--justask-6bfb9.europe-west4.hosted.app
    availability:
      - BUILD
  - variable: VITE_FIREBASE_PROJECT_ID
    value: justask-6bfb9
    availability:
      - BUILD
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: justask-6bfb9.firebasestorage.app
    availability:
      - BUILD
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "40146464592"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_APP_ID
    value: "1:40146464592:web:e720bc1e592f8bbd3a4655"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_MEASUREMENT_ID
    value: G-FHY74V0R2S
    availability:
      - BUILD

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # שליחת מיילים (Resend). בלי המפתח האפליקציה עובדת — notify פשוט לא
  # ישלח מייל למי שאין לו פוש. זו נפילה מדודה ולא קריסה.
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  # מפתח לנקודת הקצה /__cron/deletions. המחיקות מתבצעות ממילא מעצמן
  # (sweepDeletionsIfDue), וזה הערוץ הידני/המתוזמן — בלי המפתח הנתיב
  # מחזיר 404 ולא מאשר את קיומו.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
