# Firebase App Hosting — קונפיגורציית הפריסה של JustAsk.
# הבנייה: vite build עם NITRO_PRESET=node-server → שרת Node ב-.output/server.
# מפתח Gemini מגיע מ-Cloud Secret Manager — לעולם לא בקוד.

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NITRO_PRESET
    value: node-server
    availability:
      - BUILD

  # קונפיגורציית Firebase ציבורית (client config) — נדרשת בזמן הבנייה כי .env לא בגיט.
  # אלה ערכים ציבוריים-בתכנון: הם ממילא מוטמעים ב-bundle שנשלח לכל דפדפן.
  - variable: VITE_FIREBASE_API_KEY
    value: AIzaSyD1ipfVOVOJypr8jU04aSg1frV21Cptp-8
    availability:
      - BUILD
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    # ⚠️ הוחזר ל-firebaseapp.com אחרי בדיקה חיה.
    #
    # ה-proxy ב-src/server.ts עובד ו-/__/auth/handler מוגש מהדומיין שלנו,
    # אבל גוגל דחתה את ההתחברות ב-redirect_uri_mismatch: כתובת ההחזרה
    # החדשה לא הייתה רשומה ב-OAuth client. היא נוספה שם — אבל גוגל
    # מזהירה שההפצה אורכת "5 דקות עד כמה שעות", ולכן אי אפשר להישען
    # עליה כרגע.
    #
    # להעביר חזרה לדומיין שלנו רק אחרי שבודקים ידנית שההתחברות עוברת
    # מקצה לקצה. עד אז: authDomain כאן, signInWithRedirect בנייד — וזו
    # ההגדרה הסטנדרטית שרוב האפליקציות עובדות איתה.
    value: justask-6bfb9.firebaseapp.com
    availability:
      - BUILD
  - variable: VITE_FIREBASE_PROJECT_ID
    value: justask-6bfb9
    availability:
      - BUILD
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: justask-6bfb9.firebasestorage.app
    availability:
      - BUILD
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "40146464592"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_APP_ID
    value: "1:40146464592:web:e720bc1e592f8bbd3a4655"
    availability:
      - BUILD
  - variable: VITE_FIREBASE_MEASUREMENT_ID
    value: G-FHY74V0R2S
    availability:
      - BUILD

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
