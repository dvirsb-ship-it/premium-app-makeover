<meta charset="utf-8" />
<style>
  /*
   * תמונה לפוסט — 1200×627, המידה של לינקדאין ופייסבוק.
   *
   * הגרסה הראשונה הייתה סיסמה עם קו חוצה ("אתה רודף אחרי לקוחות"), וזה
   * נקרא כפרסומת. עורך דין מסנן פרסומת בשנייה. אז במקום טענה — **הסבר**:
   * שלושת השלבים של המוצר, בשורה, כמו שהם באמת קורים.
   *
   * מי שרואה את זה בפיד מבין תוך שנייה מה המוצר עושה, וזה כל התפקיד.
   * ההבלטה היחידה נופלת על "הוא בוחר", כי זו הנקודה שבה זה שונה מהקיים.
   */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:627px; overflow:hidden; }
  body {
    position:relative; background:#0B1120; direction:rtl;
    font-family:"Heebo","Assistant",-apple-system,"Segoe UI",sans-serif;
  }
  /* אור המותג — אותה הילה חמה מלמעלה שיש באפליקציה עצמה, plus קו זהב
     בקצה העליון. בלעדיהם התמונה נקראת ככרטיס כהה גנרי של מישהו אחר. */
  .aura { position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 76% -22%, rgba(212,175,55,0.20), transparent 56%),
      radial-gradient(90% 70% at 8% 118%, rgba(56,89,168,0.20), transparent 60%); }
  .topline {
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent 0%, #D4AF37 26%, #F1E4C3 52%, #D4AF37 74%, transparent 100%);
  }
  .wrap { position:relative; z-index:2; height:100%; display:flex; flex-direction:column;
          justify-content:center; padding:0 78px; }
  .mark { font:700 14px system-ui; letter-spacing:.44em; color:#D4AF37; text-transform:uppercase; }

  .steps { margin-top:46px; display:flex; align-items:stretch; gap:0; }
  .step { flex:1; padding-inline-end:34px; }
  .step + .step { padding-inline-start:34px; border-inline-start:1px solid rgba(255,255,255,.10); }
  .n {
    display:grid; place-items:center; width:34px; height:34px; border-radius:99px;
    font:800 14px system-ui; color:#0B1120;
    background:linear-gradient(#F1E4C3,#D4AF37);
  }
  .step.last .n { background:none; color:#E9C96A; box-shadow:inset 0 0 0 1.5px rgba(212,175,55,.6); }
  .t { margin-top:18px; font:700 29px/1.34 system-ui; color:#FFFFFF; letter-spacing:-.01em; }
  .step.last .t { color:#E9C96A; }
  .s { margin-top:11px; font:400 17px/1.55 system-ui; color:rgba(255,255,255,.55); }

  .foot {
    margin-top:50px; display:flex; align-items:center; gap:16px;
    font:400 17px system-ui; color:rgba(255,255,255,.52);
  }
  .pill {
    border:1px solid rgba(212,175,55,.40); border-radius:999px; padding:10px 20px;
    font:700 17px system-ui; color:#F1E4C3;
  }
</style>

<div class="aura"></div>
<div class="topline"></div>
<div class="wrap">
  <div class="mark">JustAsk</div>

  <div class="steps">
    <div class="step">
      <div class="n">1</div>
      <div class="t">הלקוח כותב<br />את המקרה</div>
      <div class="s">מגיע אליך כתיק מסודר, בלי פרטים מזהים</div>
    </div>
    <div class="step">
      <div class="n">2</div>
      <div class="t">אתה מחליט<br />אם זה רלוונטי</div>
      <div class="s">מגיש הצעה עם התנאים שלך, או מדלג</div>
    </div>
    <div class="step last">
      <div class="n">3</div>
      <div class="t">הוא משווה<br />ובוחר</div>
      <div class="s">משלמים רק כשלקוח בחר בך</div>
    </div>
  </div>

  <div class="foot">
    <span class="pill">200 עורכי הדין הראשונים</span>
    <span>חצי שנה ללא תשלום, מיום אישור האימות</span>
  </div>
</div>
