<meta charset="utf-8" />
<style>
  /*
   * נכסי רשתות חברתיות — קובץ אחד, כמה מידות, לפי ?v= ב-URL.
   *
   *   ?v=logo-dark    1024×1024  תמונת פרופיל כהה
   *   ?v=li-page      1128×191   באנר עמוד חברה בלינקדאין
   *   ?v=li-profile   1584×396   רקע פרופיל אישי בלינקדאין
   *   ?v=fb           1640×856   באנר עמוד פייסבוק
   *
   * המוטיב זהה בכולם — הדלתות ותפר האור — כי מי שרואה את הבאנר, את
   * הפוסט ואת האפליקציה צריך לזהות אותו דבר בשלושתם.
   *
   * **אזורי בטחון:** פייסבוק חותכת את הבאנר בנייד למרכז, ולינקדאין
   * מסתירה את הפינה השמאלית-תחתונה מאחורי תמונת הפרופיל. לכן כל טקסט
   * יושב במרכז האנכי ורחוק מהקצוות; שום דבר קריטי לא נוגע בשוליים.
   */
  * { margin:0; padding:0; box-sizing:border-box; }
  /* `display` מפורש גובר על תכונת ה-hidden. בלי זה המאזניים הופיעו
     בכל הבאנרים מעל הטקסט. */
  [hidden] { display:none !important; }
  body { background:#0B1120; direction:rtl; overflow:hidden;
         font-family:"Heebo","Assistant",-apple-system,"Segoe UI",sans-serif; }

  .stage { position:relative; width:100%; height:100%; overflow:hidden; }
  .door  { position:absolute; top:0; bottom:0; }
  .door.r{ right:0; left:34%;  background:linear-gradient(255deg,#17233F 0%,#0B1120 74%); }
  .door.l{ left:0;  right:66%; background:linear-gradient(105deg,#17233F 0%,#0B1120 84%); }
  .glow  { position:absolute; top:-16%; bottom:-16%; left:34%; transform:translateX(-50%);
           background:radial-gradient(closest-side, rgba(212,175,55,0.40), transparent 72%); }
  .core  { position:absolute; top:-8%; bottom:-8%; left:34%; transform:translateX(-50%);
           background:radial-gradient(closest-side, rgba(255,225,150,0.50), transparent 74%); }
  .seam  { position:absolute; top:0; bottom:0; left:34%; transform:translateX(-50%);
           background:linear-gradient(180deg,transparent 0%,#FFF6DC 18%,#FFE9A8 50%,#FFF6DC 82%,transparent 100%); }
  .aura  { position:absolute; inset:0;
           background:radial-gradient(120% 88% at 68% -18%, rgba(212,175,55,0.15), transparent 56%); }

  .copy { position:absolute; z-index:3; right:0; top:50%; transform:translateY(-50%); }
  .mark { font-weight:700; letter-spacing:.44em; color:#D4AF37; text-transform:uppercase; }
  .line { color:#FFFFFF; font-weight:800; letter-spacing:-.015em; white-space:nowrap; }
  .sub  { color:rgba(255,255,255,.58); font-weight:400; white-space:nowrap; }

  /* ── פרופיל כהה ריבועי ─────────────────────────── */
  body.logo-dark { width:1024px; height:1024px; }
  .logo-wrap { position:absolute; inset:0; display:grid; place-items:center; z-index:3; }
  .logo-wrap svg { width:430px; height:430px; }

  /* ── באנר עמוד חברה — נמוך מאוד ────────────────── */
  body.li-page { width:1128px; height:191px; }
  body.li-page .glow { width:180px; } body.li-page .core { width:34px; }
  body.li-page .seam { width:2px; }
  body.li-page .copy { right:54px; }
  body.li-page .mark { font-size:11px; }
  body.li-page .line { margin-top:9px; font-size:25px; }
  body.li-page .sub  { margin-top:6px; font-size:13.5px; }

  /* ── רקע פרופיל אישי ───────────────────────────── */
  body.li-profile { width:1584px; height:396px; }
  body.li-profile .glow { width:330px; } body.li-profile .core { width:56px; }
  body.li-profile .seam { width:3px; }
  body.li-profile .copy { right:96px; }
  body.li-profile .mark { font-size:15px; }
  body.li-profile .line { margin-top:20px; font-size:52px; }
  body.li-profile .sub  { margin-top:14px; font-size:22px; }

  /* ── באנר פייסבוק ──────────────────────────────── */
  body.fb { width:1640px; height:856px; }
  body.fb .glow { width:420px; } body.fb .core { width:72px; }
  body.fb .seam { width:4px; }
  body.fb .copy { right:130px; }
  body.fb .mark { font-size:19px; }
  body.fb .line { margin-top:28px; font-size:76px; }
  body.fb .sub  { margin-top:22px; font-size:31px; }
</style>

<div class="stage">
  <div class="door r"></div><div class="door l"></div><div class="aura"></div>
  <div class="glow"></div><div class="core"></div><div class="seam"></div>

  <div class="logo-wrap" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="#F1E4C3" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
      <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
      <path d="M7 21h10" /><path d="M12 3v18" />
      <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" />
    </svg>
  </div>

  <div class="copy">
    <div class="mark">JustAsk</div>
    <div class="line">מתארים את המקרה. עורכי הדין פונים אליכם.</div>
    <div class="sub">בודקים אם יש עילה משפטית, ומתחברים לעורך דין מתאים.</div>
  </div>
</div>

<script>
  const v = new URLSearchParams(location.search).get("v") || "li-profile";
  document.body.className = v;
  if (v === "logo-dark") {
    document.querySelector(".copy").hidden = true;
    document.querySelector(".logo-wrap").hidden = false;
    // בריבוע התפר עובר למרכז — אין צד ארוך שיאזן אותו
    for (const el of document.querySelectorAll(".glow,.core,.seam,.door.r,.door.l")) {
      if (el.classList.contains("door")) {
        el.style[el.classList.contains("r") ? "left" : "right"] = "50%";
      } else el.style.left = "50%";
    }
  }
</script>
